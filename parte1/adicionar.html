<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
    <link rel="stylesheet" href=style.css>
	<link rel="icon" href="../img/cinetrack_logo.png" type="imagem/png">
</head>
<body>
    <a href="index.html">←Voltar</a>
    <h1>Adicionar Filme</h1>
    <form id="form-filme">
    <div>
        <label>Titulo<br>
        <input required></label><br>
        <label>Ano<br>
        <input type="number" min="1888" max="2030" required>
        </label><br>
        <label>Gênero<br>
        <input required></label><br>
        <label>URL do pôster<br>
        <input></label><br>
        <label>Status<br>
            <select required>
                <option>Quero Assistir</option>
                <option>Assistindo</option>
                <option>Assistido</option>
            </select>
        </label><br>
        <label>Nota (1 a 5)<br><input type="number" min="1" max="5"></label><br>
        <label>Comentário<br>
        <textarea placeholder="Insira comentário" rows="4" cols="25"></textarea></label><br>
        <button type="button">Cancelar</button>
        <button type="submit">Salvar</button>
    </div>
    </form>
</body>
</html>
