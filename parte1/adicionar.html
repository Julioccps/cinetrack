<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
    <link rel="stylesheet" href=style.css>
	<link rel="icon" href="../img/cinetrack_logo.png" type="imagem/png">
</head>
<body>
    <a href="index.html">←Voltar</a>
    <h1>Adicionar Filme</h1>
    <form id="form-filme">
    <div>
        <div class="campo">
            <label>Titulo
            <input required></label>
        </div>
        <div class="campo">
            <label>Ano
            <input type="number" min="1888" max="2030" required>
            </label>
        </div>
        <div class="campo">
            <label>Gênero
            <input required></label>
        </div>
        <div class="campo">
            <label>URL do pôster
            <input></label>
        </div>
        <div class="campo">
            <label>Status
                <select required>
                    <option>Quero Assistir</option>
                    <option>Assistindo</option>
                    <option>Assistido</option>
                </select>
            </label>
        </div>
        <div class="campo">
            <label>Nota (1 a 5)
            <input type="number" min="1" max="5">
            </label>
        </div>
        <div class="campo">
            <label>Comentário
            <textarea placeholder="Insira comentário" rows="4" cols="25"></textarea></label>
        </div>
        <div class="acoes">
            <button type="button">Cancelar</button>
            <button type="submit">Salvar</button>
        </div>
    </div>
    </form>
</body>
</html>
