<!DOCTYPE html>
<html lang="pt-br">

<head>
	<link rel="stylesheet" href=style.css>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="icon" href="../img/cinetrack_logo.png" type="imagem/png">
</head>

<body>
    <header>
        <h1><img src="../img/cinetrack_logo.png" id="cinetrack_logo" width="50px" alt="Logo do CineTrack">CineTrack</h1>

        <section>
            <input type="search" placeholder="&#x1F50D;Buscar Filme" aria-label="Buscar Filme">
            <button id="adicionar" >+ Adicionar</button>
        </section>
        <nav aria-label="Filtros de Status">
            <button class="ativo" data-status="todos" aria-pressed="true">Todos</button>
            <button data-status="assistido" aria-pressed="false">Assistido</button>
            <button data-status="assistindo" aria-pressed="false">Assistindo</button>
            <button data-status="quero" aria-pressed="false">Quero assistir</button>
        </nav>
    </header>
    <div id="modal" hidden>
        <div class="modal-conteudo">
            <h1>Adicionar Filme</h1>
            <form id="form-filme">
            <div>
                <div class="campo">
                    <label>Titulo
                    <input name="titulo" required></label>
                </div>
                <div class="campo">
                    <label>Ano
                    <input name="ano" type="number" min="1888" max="2030" required>
                    </label>
                </div>
                <div class="campo">
                    <label>Gênero
                    <input name="genero" required></label>
                </div>
                <div class="campo">
                    <label>URL do pôster
                    <input name="poster"></label>
                </div>
                <div class="campo">
                    <label>Status
                        <select name="status" required>
                            <option value="quero">Quero Assistir</option>
                            <option value="assistindo">Assistindo</option>
                            <option value="assistido">Assistido</option>
                        </select>
                    </label>
                </div>
                <div class="campo">
                    <label>Nota (1 a 5)
                    <input name="nota" type="number" min="1" max="5">
                    </label>
                </div>
                <div class="campo">
                    <label>Comentário
                    <textarea name="comentario" placeholder="Insira comentário" rows="4" cols="25"></textarea></label>
                </div>
                <div class="acoes">
                    <button type="button" id="cancelar">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
                </div>
            </form>
        </div>
    </div>
    <main>
        <section id="lista" aria-live="polite"></section>
    </main>

    <footer>
        <small>&copy 2026 Cinetrack</small>
        <a href="sobre.html">Sobre o projeto</a>
    </footer>

    <script src="app.js"></script>
</body>

</html>
